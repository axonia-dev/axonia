name: Bug report
description: Something in a Self-hosted installation does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Release
      description: The release the installation runs, for example 0.1.0.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Docker Compose
        - Helm chart
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What was done, what happened, and what was expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as an Owner
        2. Open ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The backend's and the edge's logs around the failure, with every secret removed.
      render: text
