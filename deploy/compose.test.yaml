# The end-to-end stack: compose.yaml built from this checkout, with mock-oauth2-server as the identity provider,
# Mailpit for mail, and a client metadata document an agent connects with. No setting points the backend at Mailpit:
# frontend/e2e/stack/selfhosted-edition.spec.ts configures it in the application, as an Owner would. Test only.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml --env-file deploy/test/e2e.env up --build --wait
#   docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml --env-file deploy/test/e2e.env down -v
#
# The edge and the backend must both reach the identity provider at the address the browser uses, because the
# edge accepts plain http for it only on localhost and the backend compares the issuer character for character. Each
# reaches it through a relay that listens on its own localhost; a relay outlives no restart of the service it sits
# in, so start and stop the stack whole.
name: axonia-e2e

services:
  backend:
    build:
      context: ../backend
      dockerfile: selfhosted-app/Dockerfile
    environment:
      # A session reminder sent now reaches Mailpit within seconds rather than minutes.
      AXONIA_COMMUNICATION_PRODUCE_INTERVAL: 2s
      AXONIA_COMMUNICATION_DRAIN_INTERVAL: 2s
      AXONIA_MCP_OAUTH_TRUSTED_CLIENT_DOMAINS: cimd.test
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -Djavax.net.ssl.trustStore=/certs/trust.p12 -Djavax.net.ssl.trustStorePassword=e2e-only-trust -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - e2e-certs:/certs:ro
    depends_on:
      cimd:
        condition: service_healthy

  edge:
    build:
      context: ..
      dockerfile: selfhosted-edge/Dockerfile

  backend-issuer-relay:
    image: alpine/socat:1.8.0.3
    network_mode: service:backend
    command: TCP-LISTEN:18082,fork,reuseaddr TCP:issuer:18082

  edge-issuer-relay:
    image: alpine/socat:1.8.0.3
    network_mode: service:edge
    command: TCP-LISTEN:18082,fork,reuseaddr TCP:issuer:18082

  issuer:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      SERVER_PORT: "18082"
      # Signs in whoever fills its form, with the claims typed there; every token is audienced to the backend.
      JSON_CONFIG: >-
        {"interactiveLogin": true, "tokenCallbacks": [{"issuerId": "axonia", "tokenExpiry": 300,
        "requestMappings": [{"requestParam": "grant_type", "match": "*", "claims": {"aud": ["axonia-e2e"]}}]}]}
    ports:
      - 127.0.0.1:18082:18082

  mailpit:
    image: axllent/mailpit:v1.28
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - 127.0.0.1:18086:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12

  cimd:
    build: ./test/cimd
    image: axonia-e2e/cimd:e2e
    volumes:
      - e2e-certs:/certs
    networks:
      default:
        aliases:
          - cimd.test
    healthcheck:
      test: ["CMD", "bash", "-c", "test -s /certs/trust.p12 && exec 3<>/dev/tcp/127.0.0.1/443"]
      interval: 2s
      timeout: 5s
      retries: 60

volumes:
  e2e-certs:
