{{- if .Values.ingress.enabled }}
{{- $host := (urlParse (required "publicUrl is required" .Values.publicUrl)).hostname }}
{{- $routes := list (dict "suffix" "" "paths" (list (dict "path" "/" "type" "Prefix")) "annotations" .Values.ingress.annotations) }}
{{- if .Values.ingress.authAnnotations }}
{{- $signIn := list (dict "path" "/auth/login" "type" "Exact") (dict "path" "/auth/callback" "type" "Exact") }}
{{- $routes = append $routes (dict "suffix" "-auth" "paths" $signIn "annotations" (merge (deepCopy .Values.ingress.authAnnotations) .Values.ingress.annotations)) }}
{{- end }}
{{- range $routes }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "axonia.edgeName" $ }}{{ .suffix }}
  labels:
    {{- include "axonia.labels" $ | nindent 4 }}
    app.kubernetes.io/component: edge
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $.Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .type }}
            backend:
              service:
                name: {{ include "axonia.edgeName" $ }}
                port:
                  name: http
          {{- end }}
{{- end }}
{{- end }}
