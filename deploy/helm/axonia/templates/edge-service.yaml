apiVersion: v1
kind: Service
metadata:
  name: {{ include "axonia.edgeName" . }}
  labels:
    {{- include "axonia.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  type: ClusterIP
  selector:
    {{- include "axonia.selectorLabels" (dict "context" . "component" "edge") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
