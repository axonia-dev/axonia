{{- /*
Generated once, then read back at every upgrade. Without a cluster lookup answers nothing, and a key made there would
change at every render, so the Secret is left out until settingsKey.existingSecret names one. Listing Secrets answers a
list from any cluster, even before the namespace exists.
*/ -}}
{{- if not .Values.settingsKey.existingSecret }}
{{- if lookup "v1" "Secret" .Release.Namespace "" }}
{{- $name := include "axonia.settingsKeySecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "axonia.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    # Losing it makes the stored mail password unreadable: an uninstall leaves it, as it leaves the database.
    helm.sh/resource-policy: keep
type: Opaque
data:
  AXONIA_SETTINGS_KEY: {{ get $existing "AXONIA_SETTINGS_KEY" | default (randBytes 32 | b64enc) | quote }}
  {{- with get $existing "AXONIA_SETTINGS_PREVIOUS_KEYS" }}
  AXONIA_SETTINGS_PREVIOUS_KEYS: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
