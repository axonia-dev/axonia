# The Self-hosted edition on a developer's machine: the backend on 8090, beside its dev server on 3200 (pnpm
# dev:selfhosted), against the database, identity provider and mail catcher of deploy/dev/compose.yaml, whose
# README has the steps. Every value is a checked-in local constant.
server.port=8090

# Boot's Compose support starts those services with the run, from the backend directory the run is started in.
spring.docker.compose.enabled=true
spring.docker.compose.file=../deploy/dev/compose.yaml

# Its own server, so its migration chain and its two roles are created as on a company's fresh database.
spring.datasource.url=jdbc:postgresql://localhost:5433/axonia
spring.datasource.password=axonia_app
spring.flyway.url=jdbc:postgresql://localhost:5433/axonia
spring.flyway.user=admin
spring.flyway.password=admin
spring.flyway.placeholders.app-password=axonia_app
spring.flyway.placeholders.communication-read-password=communication_read
axonia.tenant-discovery.datasource.url=jdbc:postgresql://localhost:5433/axonia
axonia.tenant-discovery.datasource.password=communication_read

# The dev server of pnpm dev:selfhosted, which stands in for selfhosted-edge and stamps this secret.
axonia.public-base-url=http://localhost:3200
axonia.edge.shared-secrets=local-dev-edge-secret
axonia.communication.unsubscribe-secret=local-dev-unsubscribe-secret
axonia.installation.settings-key=ZGV2LWxvY2FsLXNldHRpbmdzLWtleS0zMi1ieXRlcyE=
app.media.local.base-path=./build/media-selfhosted

# The installation's one Organization, with whoever signs in in the group axonia-owners as an Owner. The stand-in
# identity provider of deploy/dev/compose.yaml audiences every token to axonia-local and carries the claims typed on
# its sign-in form, an organization among none of them.
axonia.selfhosted.organization.id=axonia-local
axonia.selfhosted.organization.name=Axonia
axonia.selfhosted.owner-group=axonia-owners
axonia.selfhosted.oidc.issuer-uri=http://localhost:8091/axonia
axonia.selfhosted.oidc.audience=axonia-local
