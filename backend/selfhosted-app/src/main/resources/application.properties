# The Self-hosted edition's production configuration has no profile to set. Its settings are in axonia-selfhosted.properties,
# imported after the settings both editions share: an imported file outranks the file importing it, and the later of
# two imports outranks the earlier, so a setting written here would lose to the same key in axonia-core.properties.
spring.config.import=classpath:axonia-core.properties,classpath:axonia-selfhosted.properties

# The Self-hosted edition's migration chain: the open schema at the cut-over, the migrations both editions run, then
# this edition's own.
spring.flyway.locations=classpath:db/selfhosted-baseline,classpath:db/migration,classpath:db/selfhosted
