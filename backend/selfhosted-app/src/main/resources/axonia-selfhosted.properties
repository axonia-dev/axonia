# The Self-hosted edition's settings, over axonia-core.properties. Every value an installation must supply is a bare
# ${VARIABLE}, and the application refuses to start while one is unset, naming each (ResolvedConfigurationGuard). The
# one Organization and its identity provider are axonia.selfhosted.*, set as AXONIA_SELFHOSTED_* variables and absent
# here on purpose: SelfHostedProperties refuses to start without each one it requires, where a line here would be a
# default nobody chose.

# Flyway migrates as the schema owner, which bypasses row-level security by ownership; the application connects as
# axonia_app and the tenant discovery pool as axonia_communication_read (axonia-core.properties, from DATABASE_URL,
# DATABASE_PASSWORD and DATABASE_COMMUNICATION_READ_PASSWORD). The first migration creates both roles with the
# passwords below, so each pool connects with the password its role was given.
spring.flyway.url=${DATABASE_URL}
spring.flyway.user=${DATABASE_OWNER_USERNAME}
spring.flyway.password=${DATABASE_OWNER_PASSWORD}
spring.flyway.placeholders.app-password=${DATABASE_PASSWORD}
spring.flyway.placeholders.communication-read-password=${DATABASE_COMMUNICATION_READ_PASSWORD}

# The address members reach the installation at. Links in mail and calendar identifiers are built from it.
axonia.public-base-url=${AXONIA_PUBLIC_BASE_URL}

# Only selfhosted-edge reaches the backend, proving itself with this secret, its EDGE_SHARED_SECRET.
axonia.edge.gate-enabled=true
axonia.edge.shared-secrets=${AXONIA_EDGE_SHARED_SECRETS}

# Signs the unsubscribe link of every mail.
axonia.communication.unsubscribe-secret=${AXONIA_UNSUBSCRIBE_SECRET}

# Seals every secret the installation stores in its database (the mail server's password). 32 random bytes in base64:
# openssl rand -base64 32. Losing it costs re-entering those secrets, nothing else. While a new key rolls out, the
# previous ones stay in AXONIA_SETTINGS_PREVIOUS_KEYS (comma-separated) and each start re-seals under the new key.
axonia.installation.settings-key=${AXONIA_SETTINGS_KEY}
axonia.installation.previous-settings-keys=${AXONIA_SETTINGS_PREVIOUS_KEYS:}

# The mail server is the installation's own setting: the mail server card, overridden field by field by the
# deployment's AXONIA_MAIL_* variables, and never spring.mail.*, whose sender and health check stay off. Nothing here
# sets a mail server, so a fresh installation suppresses mail until one is set.
spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderAutoConfiguration,\
  org.springframework.boot.mail.autoconfigure.MailSenderValidatorAutoConfiguration,\
  org.springframework.boot.mail.autoconfigure.MailHealthContributorAutoConfiguration

# One backend instance keeps its rate-limit buckets in memory and needs no Redis. More than one instance needs
# AXONIA_RATE_LIMIT_STORE=redis and SPRING_DATA_REDIS_URL, or every budget multiplies by the instance count, and
# MANAGEMENT_HEALTH_REDIS_ENABLED=true with them, so the health endpoint reports Redis again.
axonia.rate-limit.store=memory
management.health.redis.enabled=false

# The hosts an AI agent may name as its client; the backend fetches the agent's client metadata document from one over
# https when it connects. claude.ai lets Claude connect, as in the Cloud; an empty value trusts no host and makes no
# call.
axonia.mcp.oauth.trusted-client-domains=${AXONIA_MCP_OAUTH_TRUSTED_CLIENT_DOMAINS:claude.ai}

# Health is the one endpoint the platform's probes call (/actuator/health/readiness and /liveness), and a DOWN
# aggregate names no dependency to a caller that is not signed in.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Images on a local volume (MEDIA_LOCAL_PATH) unless APP_MEDIA_TYPE selects s3 or azure-blob with its own settings.
# No storage key is named here: with none, the s3 store authenticates as the platform's own identity.
app.media.type=local
