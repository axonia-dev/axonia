<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:v="urn:schemas-microsoft-com:vml" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${periodLabel} + ' across the communities'">The quarter</title>
<style>
@media only screen and (min-width:481px) { .rp-tag { float:right !important; margin:1px 0 0 8px !important; } }
@media only screen and (max-width:480px) { .rp-tag { margin:3px 0 0 0 !important; } .rc-stack { float:none !important; display:inline-block !important; margin-left:8px; vertical-align:middle; } }
</style>
</head>
<body style="margin:0; padding:0;">
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;"
    th:with="preheaderLine=(${sessionCount} == 0)
                           ? ${periodLabel} + ' across the communities.'
                           : (${periodLabel} + ': ' + ${sessionCount} + (${sessionCount} == 1 ? ' session' : ' sessions') + ' across the communities.')">
<div th:replace="~{_shell.html :: preheader(fallback=${preheaderLine})}">Preheader</div>
</div>
<div th:replace="~{_shell.html :: page(body=~{::content}, when='Covering', reason='Sent to members of')}">
<!-- The letter as a trailer: one sentence of figures, the topic cloud, one block per community with a poster per
     session, and the open talks as the one closing ask. Every derived value is resolved up front in th:with and every
     conditional row is a WRAPPING th:block: a th:if beside a th:replace never runs.

     The first-timer pill is a standalone count, never "N of them", and is suppressed when sessionCount is 0: the
     figure is organization-wide and survives a filter that left the letter nothing to name (see RoundupFacts). -->
<th:block th:fragment="content"
    th:with="heldNothing=${sessionCount} == 0,
             hasTopics=${topics} != null and not ${topics.isEmpty()},
             hasCommunities=${communities} != null and not ${communities.isEmpty()},
             talksPhrase=${talkCount} > 0 ? ${talkCount} + (${talkCount} == 1 ? ' talk' : ' talks') : null,
             peoplePhrase=${talkCount} > 0 and ${presenterCount} > 0 ? ${presenterCount} + (${presenterCount} == 1 ? ' person' : ' people') : null,
             sessionsPhrase=${sessionCount} + (${sessionCount} == 1 ? ' session' : ' sessions'),
             thingsPhrase=${resourceCount} > 0 ? ${resourceCount} + (${resourceCount} == 1 ? ' thing' : ' things') : null,
             firstTimerPhrase=${firstTimeContributorCount} + (${firstTimeContributorCount} == 1 ? ' first time presenter' : ' first time presenters'),
             askPhrase=${openTalkCount} + (${openTalkCount} == 1 ? ' talk still wanted' : ' talks still wanted'),
             communityRemainderPhrase='and ' + ${moreCommunitiesCount} + (${moreCommunitiesCount} == 1 ? ' more community was active.' : ' more communities were active.')">
<th:block th:if="${heldNothing}">
<tr th:replace="~{_shell.html :: bodyText(text='No sessions were held over the quarter.')}">Scale</tr>
</th:block>
<th:block th:unless="${heldNothing}">
<tr th:replace="~{_shell.html :: roundupFigures(talks=${talksPhrase}, people=${peoplePhrase}, sessions=${sessionsPhrase}, things=${thingsPhrase})}">Figures</tr>
</th:block>
<th:block th:if="${firstTimeContributorCount} != null and ${firstTimeContributorCount} > 0 and not ${heldNothing}">
<tr th:replace="~{_shell.html :: roundupPill(text=${firstTimerPhrase})}">Newcomers</tr>
</th:block>
<th:block th:if="${hasTopics}">
<!--/* A cloud is words wrapping inside one cell, so there is no tr fragment to iterate; every hex lives in topicWord. */-->
<tr>
<td style="padding:20px 0 0 0;"
><th:block th:each="topic : ${topics}"
    ><span th:replace="~{_shell.html :: topicWord(topic=${topic})}">topic</span
></th:block
></td>
</tr>
</th:block>
<th:block th:each="community : ${communities}">
<tr th:replace="~{_shell.html :: roundupCommunity(community=${community})}">Community</tr>
</th:block>
<th:block th:if="${hasCommunities} and ${moreCommunitiesCount} != null and ${moreCommunitiesCount} > 0">
<tr th:replace="~{_shell.html :: bodyText(text=${communityRemainderPhrase})}">Remainder</tr>
</th:block>
<th:block th:if="${openTalkCount} != null and ${openTalkCount} > 0">
<tr th:replace="~{_shell.html :: roundupAsk(headline=${askPhrase}, url=${communitiesUrl})}">Ask</tr>
</th:block>
</th:block>
</div>
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">
<th:block th:fragment="subject" th:text="${periodLabel} + ' across the communities'">Subject</th:block>
</div>
</body>
</html>
