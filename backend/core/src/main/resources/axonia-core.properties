# Settings every edition shares, imported by each edition's application.properties; a profile file overrides them.
# axonia.communication.sweep.enabled is on by omission, false only in axonia-core-test.properties.

spring.application.name=axonia

# RFC 7807 ProblemDetail bodies for every error response
spring.mvc.problemdetails.enabled=true

# API version travels in a header, not the path, and stays optional so /error and friends still resolve.
spring.mvc.apiversion.use.header=X-API-Version
spring.mvc.apiversion.default=1
spring.mvc.apiversion.required=false

spring.docker.compose.enabled=false

# The one public origin both the SPA and the API answer at, because the edge fronts both. This default is a
# placeholder the test suite runs with; every application sets its own: the Cloud's DEV and PROD profiles, and the
# Self-hosted application from AXONIA_PUBLIC_BASE_URL. See PublicUrlProperties.
axonia.public-base-url=https://dev-local.example.com

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=axonia_app
spring.datasource.password=${DATABASE_PASSWORD}
# 4 + 1 + 1 + 10 = 16: axonia.communication.drain-workers rows in flight (each holds a connection for
# its whole SMTP send), the drain tick's own claim, a concurrent produce tick, and the 10 that HTTP
# request handling has always run on, left whole. Raise drain-workers only together with this number.
spring.datasource.hikari.maximum-pool-size=16

# A connection held longer than this is logged with the stack that took it, so a leak is named
# rather than silently emptying the pool.
spring.datasource.hikari.leak-detection-threshold=20000

# The narrow privileged read every scheduled job discovers organizations through. Connects as
# axonia_communication_read, whose one grant is SELECT on organization.id; the role name predates this
# pool becoming shared infrastructure. See TenantDiscoveryPool.
axonia.tenant-discovery.datasource.url=${DATABASE_URL}
axonia.tenant-discovery.datasource.username=axonia_communication_read
axonia.tenant-discovery.datasource.password=${DATABASE_COMMUNICATION_READ_PASSWORD}
axonia.tenant-discovery.datasource.hikari.pool-name=tenant-discovery
axonia.tenant-discovery.datasource.hikari.maximum-pool-size=2
axonia.tenant-discovery.datasource.hikari.minimum-idle=0

# Cluster-wide jobs run on Quartz in the scheduler schema; work each instance does for itself stays on
# @Scheduled. Quartz has its own pool, as the application role on the application's database, so every profile's
# spring.datasource settings carry over and its row locks never wait behind request handling.
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.scheduler-name=axonia
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.jobStore.isClustered=true
spring.quartz.properties.org.quartz.jobStore.clusterCheckinInterval=20000
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=scheduler.qrtz_
spring.quartz.properties.org.quartz.jobStore.useProperties=true
spring.quartz.properties.org.quartz.threadPool.threadCount=4
# threadCount plus Quartz's own misfire and check-in work.
axonia.scheduler.datasource.url=${spring.datasource.url}
axonia.scheduler.datasource.driver-class-name=${spring.datasource.driver-class-name:}
axonia.scheduler.datasource.username=${spring.datasource.username}
axonia.scheduler.datasource.password=${spring.datasource.password}
axonia.scheduler.datasource.hikari.pool-name=scheduler
axonia.scheduler.datasource.hikari.maximum-pool-size=6
axonia.scheduler.datasource.hikari.minimum-idle=0

spring.threads.virtual.enabled=true

# Chosen shorter than the platform's SIGKILL grace so a redeploy's SIGTERM lets OutboxDrain finish the row in
# flight. Useless unless the platform's draining window is raised past 20s too.
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=20s

# Each edition's application names its own migration folders (spring.flyway.locations); this file names none.
# A folder that is missing from the build is an error, never skipped: a chain that silently lost a folder would
# start on a schema it never migrated.
spring.flyway.fail-on-missing-locations=true

# The axonia_app password is the Flyway placeholder `app-password`, substituted into the first migration of
# either edition's chain.
# DELIBERATELY not defaulted: every profile supplies its own, so a boot with no profile fails on an
# unresolved placeholder rather than creating the role with a password committed to this file. The key
# is `app-password`, not `app_password` - relaxed map-key binding only guarantees lowercase and `-`.

# Media storage (community look & feel). DEV/test use the local filesystem; the Cloud's PROD profile overrides to s3.
app.media.type=local
app.media.local.base-path=${MEDIA_LOCAL_PATH:./build/media}

# Hero banner cap is 5MB; allow a little headroom on the whole request.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Microsoft Entra / Graph. DEPLOYMENT PREREQUISITE: a multi-tenant app registration with
# GroupMember.Read.All and ProfilePhoto.Read.All APPLICATION permissions, admin-consented in each
# customer tenant. The tenant itself comes from each Organization's SSO connection, not from here.
axonia.idp.entra.client-id=${AXONIA_ENTRA_CLIENT_ID:}
axonia.idp.entra.client-secret=${AXONIA_ENTRA_CLIENT_SECRET:}

# Avatar bytes are only ever fetched from identity providers axonia itself federates with; anyone else
# falls back to initials.
axonia.avatar.allowed-hosts=googleusercontent.com,avatars.githubusercontent.com,graph.microsoft.com
axonia.avatar.max-bytes=2097152
axonia.avatar.timeout=5s

# --- Agent MCP server (Streamable HTTP) ---
spring.ai.mcp.server.name=axonia-agent
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.instructions=Axonia agent tools: act in your communities on behalf of the authenticated member.

# Abuse backstops on /mcp/**, /oauth/token and the consent routes. The failure and token budgets absorb NAT: a customer's whole fleet can share one address.
axonia.mcp.rate-limit.calls-per-minute=120
axonia.mcp.rate-limit.auth-failures-per-minute=30
axonia.mcp.rate-limit.token-requests-per-minute=60
axonia.mcp.rate-limit.consent-requests-per-minute=30

# MCP OAuth. Only these hosts may be CIMD client_ids.
axonia.mcp.oauth.trusted-client-domains=claude.ai

# --- Rate-limit state (shared across instances) ---
# Buckets live in Redis so replicas spend one budget rather than one each. Redis is a SOFT dependency:
# an unreachable one allows the call, counted as outcome=degraded. The timeout is
# load-bearing - a refused connection fails in a millisecond, but a hung Redis would otherwise cost
# Lettuce's default on every request.
#
# 'memory' is the alternative for a Self-hosted instance that never runs more than one backend
# replica: it keeps every bucket in this JVM, so the rate-limit store itself needs no Redis connection,
# but multiplies every budget by the replica count the moment a second instance joins, so a
# multi-instance deployment must stay on 'redis'. Redis's own health contributor runs whatever the
# choice; the Self-hosted application, which chooses 'memory', turns it off.
axonia.rate-limit.store=redis
spring.data.redis.timeout=250ms

# Redis holds rate-limit buckets and nothing else. With Spring Data Redis and JDBC both present,
# repository detection turns strict and the Redis module rejects every repository we own on its own INFO
# line. Turning its scan off removes that noise and states the intent: our repositories are JDBC ones.
spring.data.redis.repositories.enabled=false

# Redis DOES contribute to /actuator/health, deliberately: a health endpoint that hides a dependency
# failure is worth less than none. The probe groups are what must not move - the platform calls
# /actuator/health/readiness, whose group holds only readinessState, so a Redis outage leaves it UP and
# nothing restarts a backend that is serving correctly. Enabled here rather than in PROD alone so
# HealthEndpointTest can hold the contract.
management.endpoint.health.probes.enabled=true

# --- Telemetry (OTLP) ---
# Telemetry exports nothing unless a deployment says otherwise. DEV, the suite and any future
# environment therefore stay silent and work offline; PROD switches it on.
#
# Metrics is the one signal this flag is load-bearing for. micrometer-registry-otlp defaults its
# url to a collector on localhost:4318 and pushes on a step interval, so left alone it would batch
# and retry against a refused connection for the life of the process. Traces and logs are inert
# outside PROD for a second reason as well: their exporter beans are conditional on an endpoint that
# no file outside PROD sets at all, so with none set neither is ever constructed. Inside PROD that
# second reason does not apply - the endpoint is set there, to a blank when its variable is unset,
# and @ConditionalOnProperty matches a property that is present and empty - so the flag is the whole
# of it. All three signals carry the flag, so one switch governs every signal rather than only the
# one that needs it.
#
# Nothing is added to management.endpoints.web.exposure either, deliberately - metrics leave by
# push precisely so that no scrapeable /actuator/prometheus has to become reachable.
axonia.telemetry.enabled=false
management.tracing.export.otlp.enabled=${axonia.telemetry.enabled}
management.otlp.metrics.export.enabled=${axonia.telemetry.enabled}
management.logging.export.otlp.enabled=${axonia.telemetry.enabled}

# --- Outbound HTTP clients ---
# Inherited by every RestClient built from the auto-configured builder. One built from the static
# RestClient.builder() does NOT inherit them and gets no timeout at all, leaving a hung third party able
# to hold a servlet thread indefinitely - so a new outbound client injects the builder.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=10s

# --- Communication: the outbox drain ---
# batch-size, max-attempts, retry-backoff and claim-lease all govern JdbcOutbox.claim; see its javadoc.
# batch-size and claim-lease are coupled: claimed_at is stamped once and never renewed while the batch
# drains, so batch-size x 12s (MailSenders.DELIVERY's SMTP timeouts bound one message at roughly 12s) must stay well
# under claim-lease, or a second instance reclaims and re-sends rows the first is still working through.
# 20 x 12s = 4 minutes against a 15-minute lease. Raise either only after re-checking that inequality.
axonia.communication.batch-size=20
# Messages per second handed to the transport, across every worker and tenant: the provider's documented
# per-account limit, kept from doubling across replicas by the shared Redis-backed limiter.
axonia.communication.send-rate=10
# Rows in flight at once. Each holds a database connection for its whole send, so this is sized against
# spring.datasource.hikari.maximum-pool-size above - raise the two together or not at all. Each worker
# also holds one SMTP connection, and providers cap simultaneous connections independently of the rate.
axonia.communication.drain-workers=4
# Wall clock one organization's share of a tick may spend before it yields, checked only between batches,
# so a share can still run over by one batch. See CommunicationProperties' javadoc.
axonia.communication.drain-budget=45s
axonia.communication.max-attempts=5
axonia.communication.retry-backoff=5m
axonia.communication.claim-lease=15m
# How far back the wrap-up and awaiting-close producers still look for due work. Without a floor, a roster
# change re-mails about every session a community has ever held. See CommunicationWindows' javadoc.
axonia.communication.wrap-up-max-age=30d
axonia.communication.awaiting-close-max-age=30d
# How long a message and its deliveries survive after being written, how many messages one retention pass
# expires per organization, and how often that pass runs. A daily pass is ample against a ninety-day window.
axonia.communication.outbox-retention=90d
axonia.communication.retention-batch-size=200
axonia.communication.retention-interval=24h
# Deliberately NOT coupled to the interval above (unlike produce/drain): an instance restarted inside 24h -
# every redeploy - would otherwise never reach its first retention tick. The failure is silent (no error, the
# outbox just keeps growing), so a short initial delay is worth it even though it costs nothing against a
# ninety-day window.
axonia.communication.retention-initial-delay=10m
axonia.communication.unsubscribe-secret=local-dev-unsubscribe-secret

# --- Periodic roundup ---
# settle-lag: how long after a quarter closes the roundup waits, so a session held on the last day but
# closed out afterwards is still counted. The caps keep the letter readable for a fifteen-guild tenant:
# per-community rather than per-letter, so one busy guild does not push out the quiet ones. Past a dozen
# words the tag cloud stops being a picture.
axonia.roundup.settle-lag=2d
axonia.roundup.community-cap=8
axonia.roundup.sessions-per-community-cap=4
axonia.roundup.topic-cap=12

# --- Edge gate ---
# The application is reachable only through its edge (an edge in front of the application, such as selfhosted-edge), which
# proves itself with a shared secret. These are the local constants every profile-less test context inherits; the
# Cloud's DEV and PROD profiles and the Self-hosted application set the gate explicitly. The list allows a rotation
# window: add the new secret, deploy, switch the edge, drop the old.
axonia.edge.gate-enabled=false
axonia.edge.shared-secrets=local-dev-edge-secret

# --- Identity ---
# How often the agent connection retention sweep deletes expired MCP codes and tokens and long-retired
# connections. Daily is ample; the rows are pruned well before they become interesting.
axonia.identity.agent-connection-retention.interval=24h
# Deliberately NOT coupled to the interval above, for the same reason as
# axonia.communication.retention-initial-delay: an instance restarted inside 24h - every redeploy - would
# otherwise never reach its first sweep.
axonia.identity.agent-connection-retention.initial-delay=20m
