# Test settings every edition shares, imported by the test application-DEV.properties.

# Tests use a Testcontainers-managed Postgres via the jdbc:tc URL scheme; the
# container is started by the JDBC driver on first connection (Flyway then runs
# the importing edition's migration chain against it). Docker Compose stays off in tests.
# Dev fallback on in tests so integration tests that forge org-less tokens keep working.
axonia.organization.allow-default-fallback=true

# TC_DAEMON=true is load-bearing, not cosmetic. Without it ContainerDatabaseDriver stops and
# removes the container the instant its open-connection count hits zero (see its close hook).
# With minimum-idle=0 below, every long idle window (the long-running @SpringBootTest stretches)
# drains all cached Hikari pools to zero, tears the shared container down, and the next
# @DataJdbcTest reconnects to a fresh EMPTY container (Flyway never re-runs for a cached
# context), so its INSERTs fail with BadSqlGrammar. Daemon mode keeps the one container alive
# for the whole JVM; Ryuk still reaps it at exit.
# loginTimeout and socketTimeout reach the Postgres driver: without them a port forward that accepts the connection
# and never answers blocks the fork for good (DedicatedPostgresContainer carries the same two bounds).
spring.datasource.url=jdbc:tc:postgresql:18:///axonia?TC_DAEMON=true&loginTimeout=30&socketTimeout=300
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.docker.compose.enabled=false

# Loopback only, so a RANDOM_PORT server is never handed a port another local process holds on 127.0.0.1.
server.address=127.0.0.1

# Cached Spring test contexts each hold a Hikari pool against the ONE shared Testcontainers
# Postgres (max_connections=100). Default sizing (max 10, min-idle 10, never released) exhausts
# it as the suite grows, and late-booting contexts then die with "FATAL: sorry, too many clients".
# Small ceiling + zero idle floor + fast reaping keeps the fleet of cached pools tiny.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000

# The resource server needs an issuer to build its JwtDecoder bean. The decoder is lazy (it
# contacts the issuer only on the first real token decode), so a full-context boot never
# reaches it; controller slices mock JwtDecoder.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://issuer.invalid

# The test application-DEV.properties SHADOWS main/resources/application-DEV.properties on the test
# classpath (Spring resolves classpath:/application-DEV.properties to the first match) and imports this
# file, so the placeholder must be repeated here. Without it every DB-backed test fails on an unresolved
# ${app-password}.
# Value must equal the password RlsStackIsolationTest uses to connect as axonia_app.
spring.flyway.placeholders.app-password=axonia_app
# Same shadowing reason, for V30's communication-read-password placeholder.
spring.flyway.placeholders.communication-read-password=communication_read

# Same shared daemon container, same reasoning: the ROLE's behavior is proven by
# CommunicationReadRoleIsolationTest, these tests prove the QUERIES.
axonia.tenant-discovery.datasource.url=jdbc:tc:postgresql:18:///axonia?TC_DAEMON=true&loginTimeout=30&socketTimeout=300
axonia.tenant-discovery.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
axonia.tenant-discovery.datasource.username=test
axonia.tenant-discovery.datasource.password=test

# CommunicationSweep is entirely absent from every test context, not merely delayed. @EnableScheduling sits on
# the application class itself, so every @SpringBootTest now boots a live scheduler, and Spring's TestContext cache
# keeps a context - and its scheduler - alive for the whole gate's duration, not one test class's. A tick landing
# between two statements of an unrelated integration test is a real failure mode: e.g. an integration test
# that purges one organization, then asserts zero rows for it across every org-scoped table - a tick in
# between would insert SESSION_UPCOMING rows for that org and fail the assertion. Separately, cleanup.sql's
# TRUNCATE (ACCESS EXCLUSIVE) racing a sweep transaction at AFTER_TEST_CLASS is a lock-wait/deadlock source. Both
# read/write pools already point at the one shared jdbc:tc container, whose driver connects as the container
# superuser regardless of which credentials are configured, bypassing RLS entirely for whichever organization a
# tick would find - so this is not a narrow window, it is a certainty for any cached context that lives past the
# sweep interval, and every context does. CommunicationSweepDisabledInTestsTest pins this.
axonia.communication.sweep.enabled=false

# Deliberately dead. Leaving this unset makes Spring Boot default to localhost:6379, which on a
# developer's machine is the compose Redis that spring.docker.compose.enabled starts - so the
# suite would share real bucket state with local development and with itself, reintroducing the
# order-dependence this suite has been bitten by before. Port 1 refuses instantly, the store
# fails open, and every context that does not assert limiting is unaffected. The tests that DO
# assert limiting inject FakeRateLimitStore, and the Redis path has its own container test.
spring.data.redis.url=redis://localhost:1

# The clustered scheduler never starts in a test: a context kept alive by the context cache would fire jobs mid-assertion.
spring.quartz.auto-startup=false
# Quartz looks a job store's connections up by scheduler name in one JVM-wide registry, so every cached test context
# needs its own name, or one context's scheduler reaches another's database.
spring.quartz.scheduler-name=axonia-test-${random.uuid}
